<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="style.css">
<style>
  .hero {
    height: 400px;
    background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), 
                url('https://images.unsplash.com/photo-1557682224-33bb4a46bbde');
    background-size: cover;
    background-position: center;
    padding: 100px 20px;
    text-align: center;
    color: white;
    box-sizing: border-box;
  }
  .hero h1 { font-size: 48px; margin-bottom: 20px; }
  .hero p { font-size: 18px; margin-bottom: 30px; }
  .hero-btn {
    padding: 12px 30px;
    background: #4a6cf7;
    color: white;
    border: none;
    border-radius: 25px;
    font-size: 16px;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="hero">
  <h1>Welcome to Our Website</h1>
  <p>We build amazing web experiences with Box Model</p>
  <button class="hero-btn">Get Started</button>
</div>

<p style="text-align:center; margin-top:20px;">
  <b>Used:</b> height: 400px, background (gradient + image), padding: 100px 20px
</p>

</body>
</html>
