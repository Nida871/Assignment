<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="BCA Assignment by Nida">
    <meta name="author" content="Nida">
    <link rel="stylesheet" href="style.css">
    <title>Student Registration - Task 16</title>
</head>
<body>
    <header>
        <h1>Student Registration Form</h1>
        <nav>
            <a href="portfolio.html">Portfolio</a> |
            <a href="mycollege.html">My College</a>
        </nav>
        <hr>
    </header>

    <main>
        <form action="#" method="post">
            <fieldset>
                <legend>Personal Details</legend>
                
                <label for="fullname">Full Name:</label><br>
                <input type="text" id="fullname" name="fullname" placeholder="Nida" required><br><br>

                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email" placeholder="nidaidrisi232@gmail.com" required><br><br>

                <label for="phone">Phone:</label><br>
                <input type="tel" id="phone" name="phone" placeholder="9258705866"><br><br>

                <label for="dob">Date of Birth:</label><br>
                <input type="date" id="dob" name="dob"><br><br>

                <label>Gender:</label><br>
                <input type="radio" id="female" name="gender" value="female">
                <label for="female">Female</label>
                <input type="radio" id="male" name="gender" value="male">
                <label for="male">Male</label><br><br>

                <label for="course">Course:</label><br>
                <select id="course" name="course">
                    <option value="">--Select Course--</option>
                    <option value="bca">BCA</option>
                    <option value="bba">BBA</option>
                    <option value="bcom">B.Com</option>
                </select><br><br>
            </fieldset>

            <br>
            <input type="checkbox" id="terms" name="terms" required>
            <label for="terms">I agree to terms and conditions</label><br><br>

            <button type="submit">Register</button>
            <button type="reset">Reset</button>
        </form>
    </main>

    <footer>
        <hr>
        <p>© 2026 Nida</p>
    </footer>
</body>
</html>
