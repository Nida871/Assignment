<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="style.css">
<style>
  body { background: #f2f4ff; display: flex; justify-content: center; padding: 40px; }
  .profile-card {
    width: 300px;
    background: white;
    border-radius: 15px;
    padding: 30px 20px;
    margin: 20px;
    text-align: center;
    box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    box-sizing: border-box;
    border: 1px solid #e0e0e0;
  }
  .profile-card img {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    border: 4px solid #4a6cf7;
    padding: 3px;
    margin-bottom: 15px;
  }
  .profile-card h2 { margin: 10px 0 5px; }
  .profile-card p { color: #666; margin-bottom: 20px; }
  .profile-btn {
    padding: 10px 25px;
    background: #4a6cf7;
    color: white;
    border: none;
    border-radius: 20px;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="profile-card">
  <img src="https://i.pravatar.cc/150?img=12" alt="Profile">
  <h2>Your Name</h2>
  <p>Frontend Developer | Student</p>
  <p>Box Model, Flexbox, HTML/CSS</p>
  <button class="profile-btn">Contact Me</button>
</div>

</body>
</html>
