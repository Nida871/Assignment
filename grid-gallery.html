<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: Arial; padding: 20px; background: #f5f5f5; }
  h1 { text-align:center; margin-bottom: 20px; }
  .gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    max-width: 900px;
    margin: 0 auto;
  }
  .gallery img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    border-radius: 10px;
  }
  @media (max-width: 600px) {
    .gallery { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 400px) {
    .gallery { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<h1>Photo Gallery - Task 36</h1>

<div class="gallery">
  <img src="https://picsum.photos/300/200?random=1" alt="1">
  <img src="https://picsum.photos/300/200?random=2" alt="2">
  <img src="https://picsum.photos/300/200?random=3" alt="3">
  <img src="https://picsum.photos/300/200?random=4" alt="4">
  <img src="https://picsum.photos/300/200?random=5" alt="5">
  <img src="https://picsum.photos/300/200?random=6" alt="6">
</div>

<p style="text-align:center; margin-top:20px;">
  Used: display:grid, grid-template-columns: repeat(3, 1fr), gap
</p>

</body>
</html>
