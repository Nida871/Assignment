<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: Arial; background: #f5f5f5; padding: 20px; }
  h1 { text-align:center; margin: 20px 0; }
  .product-container {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    justify-content: center;
  }
  .card {
    width: 200px;
    background: white;
    border-radius: 10px;
    padding: 15px;
    text-align: center;
    box-shadow: 0 3px 10px rgba(0,0,0,0.1);
  }
  .card img {
    width: 100%;
    height: 120px;
    object-fit: cover;
    border-radius: 8px;
  }
  .card h3 { margin: 10px 0 5px; font-size: 16px; }
  .card p { color: #4a6cf7; font-weight: bold; }
</style>
</head>
<body>

<h1>Our Products</h1>

<div class="product-container">
  <div class="card">
    <img src="https://via.placeholder.com/200x120?text=Shoes">
    <h3>Shoes</h3>
    <p>₹999</p>
  </div>
  <div class="card">
    <img src="https://via.placeholder.com/200x120?text=Watch">
    <h3>Watch</h3>
    <p>₹1999</p>
  </div>
  <div class="card">
    <img src="https://via.placeholder.com/200x120?text=Bag">
    <h3>Bag</h3>
    <p>₹799</p>
  </div>
  <div class="card">
    <img src="https://via.placeholder.com/200x120?text=T-Shirt">
    <h3>T-Shirt</h3>
    <p>₹499</p>
  </div>
  <div class="card">
    <img src="https://via.placeholder.com/200x120?text=Cap">
    <h3>Cap</h3>
    <p>₹299</p>
  </div>
  <div class="card">
    <img src="https://via.placeholder.com/200x120?text=Headphone">
    <h3>Headphone</h3>
    <p>₹1499</p>
  </div>
</div>

<p style="text-align:center; margin-top:20px;">
  Used: display:flex + flex-wrap:wrap + gap:20px + justify-content:center
</p>

</body>
</html>
