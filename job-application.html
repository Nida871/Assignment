<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="BCA Assignment by Nida">
<meta name="author" content="Nida">
    <title>Job Application - Task 17</title>
</head>
<body>
    <h1>Job Application Form</h1>
    <hr>

    <form action="#" method="post" enctype="multipart/form-data">
        
        <label for="name">Full Name:</label><br>
        <input type="text" id="name" name="name" required><br><br>

        <label for="email2">Email:</label><br>
        <input type="email" id="email2" name="email" required><br><br>

        <label for="pass">Password (for account):</label><br>
        <input type="password" id="pass" name="password"><br><br>

        <label for="phone2">Phone:</label><br>
        <input type="tel" id="phone2" name="phone"><br><br>

        <label for="website">Portfolio URL:</label><br>
        <input type="url" id="website" name="website" placeholder="https://..."><br><br>

        <label for="exp">Experience (years):</label><br>
        <input type="number" id="exp" name="experience" min="0" max="20"><br><br>

        <label for="dob2">Date of Birth:</label><br>
        <input type="date" id="dob2" name="dob"><br><br>

        <label for="join">Available Join Time:</label><br>
        <input type="time" id="join" name="jointime"><br><br>

        <label for="favcolor">Favorite Color:</label><br>
        <input type="color" id="favcolor" name="color"><br><br>

        <label>Expected Salary Range:</label><br>
        <input type="range" id="salary" name="salary" min="20000" max="100000" step="5000">
        <span>20k to 1L</span><br><br>

        <label>Gender:</label><br>
        <input type="radio" name="gender2" value="female" id="f"> <label for="f">Female</label>
        <input type="radio" name="gender2" value="male" id="m"> <label for="m">Male</label><br><br>

        <label>Skills:</label><br>
        <input type="checkbox" id="html" name="html"><label for="html"> HTML</label>
        <input type="checkbox" id="css" name="css"><label for="css"> CSS</label>
        <input type="checkbox" id="js" name="js"><label for="js"> JavaScript</label><br><br>

        <label for="resume">Upload Resume:</label><br>
        <input type="file" id="resume" name="resume" accept=".pdf,.doc"><br><br>

        <label for="about">Why should we hire you?</label><br>
        <textarea id="about" name="about" rows="4" cols="40" placeholder="Write here..."></textarea><br><br>

        <input type="hidden" name="formType" value="jobApplication">

        <button type="submit">Submit Application</button>
        <button type="reset">Reset</button>

    </form>
</body>
</html>
